<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои треки</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { text-align: center; }
        .track {
            background: #16213e;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .track p {
            margin: 0 0 8px 0;
            font-size: 16px;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>🎵 Мои треки</h1>

    <div class="track">
        <p>track1.mp3</p>
        <audio controls src="track1.mp3"></audio>
    </div>

    <div class="track">
        <p>track2.mp3</p>
        <audio controls src="track2.mp3"></audio>
    </div>

    <div class="track">
        <p>track3.mp3</p>
        <audio controls src="track3.mp3"></audio>
    </div>
</body>
</html>
